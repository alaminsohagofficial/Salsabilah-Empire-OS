<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salsabilah Empire POS | Control Center</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #D4AF37;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        h1 {
            color: #D4AF37;
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .badge {
            background: #34A853;
            color: #000;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
            font-size: 0.95rem;
        }
        .label { color: #94a3b8; }
        .value { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal-card">
        <h1>👑 Salsabilah Amin Empires Ltd.</h1>
        <div class="badge">Operational & Secured</div>
        
        <div class="info-row">
            <span class="label">System Core:</span>
            <span class="value">Salsabilah Empire POS</span>
        </div>
        <div class="info-row">
            <span class="label">Location Base:</span>
            <span class="value">SR Electronics Park, Hatboalia, Chuadanga</span>
        </div>
        <div class="info-row">
            <span class="label">Partnership:</span>
            <span class="value">Gemini AI Core</span>
        </div>
        <div class="info-row">
            <span class="label">SMS Service:</span>
            <span class="value">Salsabilah Lifetime Free API</span>
        </div>
    </div>
</body>
</html>
